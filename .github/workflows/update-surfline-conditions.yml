name: Update surfline conditions

# Runs the polite set-cover refresh from a GitHub-hosted runner using a real
# headful Chrome (xvfb) + Chrome DevTools Protocol — the same in-browser fetch
# path proven to pass Surfline's Cloudflare from a datacenter IP by
# probe-surfline-browser.yml. Local scripts/refresh-surfline-daily.sh (headed
# Chrome on a home IP) remains as a documented fallback if Cloudflare tightens.
on:
  schedule:
    # Off-peak minute on purpose: top-of-hour crons get heavily queued.
    # Refresh at Lisbon dawn and every six hours through the usable day so a
    # current-condition anchor never needs to masquerade as an all-day signal.
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: surfline-refresh

jobs:
  update-surfline-conditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate committed spot advice
        run: npm run check-spot-advice

      - name: Resolve Chrome binary
        id: chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "Chrome binary: ${BIN:-NONE}"
          [ -n "$BIN" ] && "$BIN" --version || echo "no chrome on runner"

      - name: Launch headful Chrome (xvfb) on a Surfline report
        run: |
          xvfb-run --auto-servernum "${{ steps.chrome.outputs.bin }}" \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9333 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/surfline-cdp-profile \
            --no-first-run --no-default-browser-check \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --window-size=1280,800 \
            --new-window "https://www.surfline.com/surf-report/praia-da-cruz-quebrada/640b9d294878ebc4c91e3d61" \
            > /tmp/chrome.log 2>&1 &
          echo "launched Chrome pid $!"

      - name: Wait for Chrome past Cloudflare
        run: |
          for i in $(seq 1 40); do
            if curl -sf --max-time 2 http://127.0.0.1:9333/json/version >/dev/null; then
              # give the Cloudflare JS challenge a moment to clear before fetching
              sleep 8
              echo "CDP up"; exit 0
            fi
            sleep 1
          done
          echo "CDP endpoint never came up"; exit 1

      - name: Refresh conditions (polite, validated, in-browser)
        run: node scripts/refresh-surfline-conditions.js --transport=cdp --port=9333

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/surfline-conditions.json; then
            echo "No surfline condition cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/surfline-conditions.json
          git commit -m "chore(data): refresh surfline conditions"
          git push

      - name: Freshness guard
        if: always()
        run: node scripts/check-conditions-freshness.js

      - name: Chrome log (diagnostics)
        if: always()
        run: tail -n 40 /tmp/chrome.log 2>/dev/null || echo "no chrome log"

      - name: Alert on stale data
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'surfline-stale';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Surfline conditions are stale or the refresh workflow failed.\n\nRun: ${runUrl}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const issue = issues.find((item) => !item.pull_request);

            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'surfline conditions stale',
                body,
                labels: [label]
              });
            }
