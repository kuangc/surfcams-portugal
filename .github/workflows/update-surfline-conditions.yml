name: Update surfline conditions

on:
  workflow_dispatch:
  # schedule:
  #   # enable only after probe-surfline validates a transport from runners (see docs/surfline-promotion-design.md §5.6)
  #   - cron: "23 5 * * *"

permissions:
  contents: write
  issues: write

concurrency: surfline-refresh

jobs:
  update-surfline-conditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh conditions (polite, validated)
        run: node scripts/refresh-surfline-conditions.js --transport=pages
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/surfline-conditions.json; then
            echo "No surfline condition cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/surfline-conditions.json
          git commit -m "chore(data): refresh surfline conditions"
          git push
      - name: Freshness guard
        if: always()
        run: node scripts/check-conditions-freshness.js
      - name: Alert on stale data
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'surfline-stale';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Surfline conditions are stale or the refresh workflow failed.\n\nRun: ${runUrl}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            const issue = issues.find((item) => !item.pull_request);

            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'surfline conditions stale',
                body,
                labels: [label]
              });
            }
