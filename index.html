<body>
  <div class="app-shell">
    <nav class="app-nav" aria-label="Primary">
      <button class="nav-button" type="button" data-route="monitor" aria-label="Monitor" aria-current="page">
        <span class="nav-icon" aria-hidden="true">▣</span>
      </button>
      <button class="nav-button" type="button" data-route="favorites" aria-label="Favorites">
        <span class="nav-icon" aria-hidden="true">★</span>
      </button>
      <button class="nav-button" type="button" data-route="explore" aria-label="Explore">
        <span class="nav-icon" aria-hidden="true">⌖</span>
      </button>
      <button class="nav-button" type="button" data-route="configure" aria-label="Configure">
        <span class="nav-icon" aria-hidden="true">☷</span>
      </button>
    </nav>

    <main class="app-main">
      <section class="screen monitor-screen" id="monitorScreen" data-active="true" data-screen="monitor" aria-labelledby="monitorTitle">
        <header class="screen-header">
          <div>
            <p class="eyebrow">Monitor</p>
            <h1 id="monitorTitle">Surfcams Portugal</h1>
          </div>
          <div class="segmented-control" role="group" aria-label="Monitor mode">
            <button type="button" id="monitorFavoritesMode" data-monitor-mode="favorites" aria-pressed="true">Favorites</button>
            <button type="button" id="monitorMightBeGoodMode" data-monitor-mode="might-be-good" aria-pressed="false">Might be good</button>
          </div>
        </header>
        <p class="status-line" id="monitorStatus">Loading cameras...</p>
        <section class="water-summary" id="monitorWaterSummary" aria-label="Water and tide"></section>
        <div class="monitor-grid" id="monitorGrid" aria-live="polite"></div>
      </section>

      <section class="screen favorites-screen" id="favoritesScreen" data-screen="favorites" hidden aria-labelledby="favoritesTitle">
        <header class="screen-header">
          <div>
            <p class="eyebrow">Favorites</p>
            <h1 id="favoritesTitle">Manage spots</h1>
          </div>
          <div class="favorite-toolbar">
            <input id="favoritesSearchInput" type="search" placeholder="Search places">
          </div>
        </header>
        <section class="water-summary" id="favoritesWaterSummary" aria-label="Water and tide"></section>
        <p class="status-line" id="favoritesStatus">Loading spots...</p>
        <div class="favorites-list" id="favoritesList"></div>
      </section>

      <section class="screen explore-screen" id="exploreScreen" data-screen="explore" hidden aria-labelledby="exploreTitle">
        <header class="screen-header explore-header">
          <div>
            <p class="eyebrow">Explore</p>
            <h1 id="exploreTitle">Map</h1>
          </div>
          <div class="explore-filters">
            <input id="searchInput" type="search" placeholder="Search beaches">
            <select id="regionSelect" aria-label="Region"></select>
            <label class="toggle-row"><input id="favoriteOnly" type="checkbox"> Favorites</label>
            <label class="toggle-row"><input id="mightBeGoodOnly" type="checkbox"> Might be good</label>
          </div>
        </header>
        <div class="map-layout">
          <aside class="browse-panel" aria-label="Browse surf spots">
            <p class="status-line" id="exploreResultsSummary">Loading spots...</p>
            <div class="explore-list" id="exploreList"></div>
          </aside>
          <div id="map" class="map"></div>
          <aside class="spot-panel" id="spotPanel" aria-live="polite">
            <div class="explore-video-shell">
              <video id="exploreVideo" muted playsinline controls></video>
              <span class="feed-status" id="exploreFeedStatus">Select a spot</span>
            </div>
            <div class="spot-panel__header">
              <div>
                <h2 id="detailName">Select a camera</h2>
                <p id="detailLocation" class="muted">Choose a marker to watch.</p>
              </div>
              <button id="detailFavorite" class="favorite-toggle" type="button" aria-label="Toggle favorite" aria-pressed="false">♡</button>
            </div>
            <section class="water-summary water-summary--compact" id="detailWaterSummary" aria-label="Water and tide"></section>
            <div class="condition-strip" id="detailConditionStrip"></div>
          </aside>
        </div>
      </section>

      <section class="screen configure-screen" id="configureScreen" data-screen="configure" hidden aria-labelledby="configureTitle">
        <header class="screen-header">
          <div>
            <p class="eyebrow">Configure</p>
            <h1 id="configureTitle">Fit for us</h1>
          </div>
        </header>
        <form class="config-form" id="configForm">
          <label>Min surf height <input id="minSurfHeightM" name="minSurfHeightM" type="number" min="0" max="4" step="0.1"></label>
          <label>Max surf height <input id="maxSurfHeightM" name="maxSurfHeightM" type="number" min="0" max="4" step="0.1"></label>
          <label>Max wind km/h <input id="maxWindSpeedKmh" name="maxWindSpeedKmh" type="number" min="0" max="80" step="1"></label>
          <label>Min period seconds <input id="minPeriodSeconds" name="minPeriodSeconds" type="number" min="0" max="20" step="0.5"></label>
          <label>Surf size scale <input id="surfSizeScale" name="surfSizeScale" type="number" min="0.2" max="2" step="0.05"></label>
          <label class="toggle-row"><input id="preferOffshore" name="preferOffshore" type="checkbox"> Prefer offshore wind</label>
          <label class="toggle-row"><input id="allowLightWind" name="allowLightWind" type="checkbox"> Allow light wind</label>
          <div class="form-actions">
            <button class="primary-button" type="submit">Save</button>
            <button class="secondary-button" id="resetConfigButton" type="button">Reset</button>
          </div>
        </form>
        <p class="status-line">The heuristic is a model, not a guarantee. Check the cam before leaving.</p>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
